<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>每日AI财经新闻</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #17233b;
    --ink-soft: #5a6b8c;
    --line: #e6eaf3;
    --brand: #4f46e5;
    --brand-2: #7c3aed;
    --brand-3: #0ea5e9;
    --shadow: 0 10px 30px rgba(30, 41, 82, 0.08);
    --shadow-hover: 0 18px 40px rgba(30, 41, 82, 0.14);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  /* ===== Hero ===== */
  .hero {
    position: relative;
    overflow: hidden;
    color: #fff;
    padding: 52px 20px 46px;
    background:
      radial-gradient(1000px 480px at 85% -10%, rgba(14,165,233,.45), transparent 60%),
      radial-gradient(800px 420px at 0% 110%, rgba(124,58,237,.5), transparent 60%),
      linear-gradient(135deg, #1e1b4b 0%, #312e81 45%, #4f46e5 100%);
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 78%);
    pointer-events: none;
  }
  .hero-inner { position: relative; max-width: 900px; margin: 0 auto; text-align: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: .12em; font-weight: 600;
    padding: 7px 16px; border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    backdrop-filter: blur(6px);
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 0 rgba(52,211,153,.7); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); }
    70% { box-shadow: 0 0 0 9px rgba(52,211,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  }
  h1 { margin: 18px 0 6px; font-size: clamp(30px, 5.4vw, 46px); font-weight: 800; letter-spacing: .02em; }
  h1 .ai { background: linear-gradient(90deg,#67e8f9,#c4b5fd,#f9a8d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .subtitle { color: rgba(255,255,255,.82); font-size: 15px; }
  .meta-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 999px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.22);
    font-size: 14px; font-weight: 600;
  }
  .pill svg { width: 15px; height: 15px; flex: none; }
  .pill.clock { font-variant-numeric: tabular-nums; }

  /* ===== Filter bar ===== */
  .filter-wrap { position: sticky; top: 0; z-index: 20; background: rgba(244,246,251,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .filter { max-width: 900px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .chip {
    cursor: pointer; user-select: none;
    font-size: 13.5px; font-weight: 600; color: var(--ink-soft);
    padding: 7px 15px; border-radius: 999px;
    background: #fff; border: 1px solid var(--line);
    transition: all .18s ease;
  }
  .chip:hover { border-color: #c7cdf3; color: var(--brand); transform: translateY(-1px); }
  .chip.active { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(79,70,229,.3); }
  .chip .count { opacity: .65; font-weight: 500; margin-left: 2px; }

  /* ===== List ===== */
  main { max-width: 900px; margin: 0 auto; padding: 26px 20px 10px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 760px) { .grid { grid-template-columns: 1fr 1fr; } .card.feature { grid-column: 1 / -1; } }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cat, #64748b); opacity: .85; }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tag {
    font-size: 12px; font-weight: 700; letter-spacing: .04em;
    color: var(--cat, #64748b);
    background: color-mix(in srgb, var(--cat, #64748b) 12%, white);
    padding: 3px 10px; border-radius: 999px;
  }
  .card-date { font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .card h3 { font-size: 16.5px; line-height: 1.5; font-weight: 700; }
  .card h3 a { background-image: linear-gradient(transparent calc(100% - 2px), rgba(79,70,229,.0) 2px); transition: color .15s; }
  .card h3 a:hover { color: var(--brand); }
  .card p { font-size: 14px; color: var(--ink-soft); }
  .card .src { margin-top: auto; font-size: 12.5px; color: #93a1bf; display: flex; align-items: center; gap: 6px; }
  .card .src .arrow { transition: transform .18s ease; }
  .card:hover .src .arrow { transform: translateX(3px); }
  .empty { text-align: center; color: var(--ink-soft); padding: 60px 20px; }

  /* ===== Footer ===== */
  footer { max-width: 900px; margin: 40px auto 0; padding: 24px 20px 42px; border-top: 1px solid var(--line); color: #93a1bf; font-size: 12.5px; text-align: center; line-height: 1.9; }
  footer strong { color: var(--ink-soft); }
  .upd { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .noscript { display: block; padding: 20px; text-align: center; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; color: #9a3412; }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="badge"><span class="dot"></span>AI × 财经 · 每日早间速递</div>
    <h1>每日<span class="ai">AI</span>财经新闻</h1>
    <p class="subtitle">每天 08:00 自动更新 · 当日最新人工智能与财经资讯</p>
    <div class="meta-row">
      <div class="pill" id="issueDate">—</div>
      <div class="pill clock" id="countdown">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span id="countdownText">距下次更新 --:--:--</span>
      </div>
    </div>
  </div>
</header>

<div class="filter-wrap">
  <nav class="filter" id="filterBar" aria-label="新闻分类筛选"></nav>
</div>

<main>
  <noscript><span class="noscript">本页需要启用 JavaScript 才能显示内容。</span></noscript>
  <div class="grid" id="newsGrid"></div>
</main>

<footer>
  <div class="upd">更新于 <strong id="genTime">—</strong> · 数据文件 news.js</div>
  <div>本页为个人资讯整理，内容由 AI 每日 08:00 检索公开报道后自动生成，可能存在滞后或误差，请以原始来源为准。</div>
  <div>所载信息仅供参考，不构成任何投资建议。来源版权归原作者 / 原媒体所有。</div>
</footer>

<script src="news.js"></script>
<script>
(function () {
  "use strict";
  var data = (window.NEWS || { issue: {}, items: [] });
  var issue = data.issue || {};
  var items = data.items || [];

  var CATEGORY_ORDER = ["头条", "市场", "公司与融资", "政策监管", "产品技术"];
  var CAT_COLOR = {
    "头条": "#e11d48",
    "市场": "#0ea5e9",
    "公司与融资": "#7c3aed",
    "政策监管": "#d97706",
    "产品技术": "#059669"
  };

  document.title = "每日AI财经新闻" + (issue.date ? " · " + issue.date : "");
  if (issue.dateLabel) document.getElementById("issueDate").textContent = "📅 " + issue.dateLabel;
  if (issue.generatedAt) document.getElementById("genTime").textContent = issue.generatedAt;

  // 倒计时至下一个 08:00
  function tick() {
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 8, 0, 0, 0);
    if (now >= next) next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 8, 0, 0, 0);
    var diff = Math.max(0, next - now);
    var h = Math.floor(diff / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    document.getElementById("countdownText").textContent = "距下次更新 " + pad(h) + ":" + pad(m) + ":" + pad(s);
  }
  tick();
  setInterval(tick, 1000);

  var cats = CATEGORY_ORDER.filter(function (c) { return items.some(function (it) { return it.cat === c; }); });
  var current = "全部";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function countOf(c) { return c === "全部" ? items.length : items.filter(function (it) { return it.cat === c; }).length; }

  function renderChips() {
    var bar = document.getElementById("filterBar");
    bar.innerHTML = "";
    ["全部"].concat(cats).forEach(function (c) {
      var b = document.createElement("button");
      b.className = "chip" + (c === current ? " active" : "");
      b.innerHTML = esc(c) + ' <span class="count">' + countOf(c) + "</span>";
      b.addEventListener("click", function () { current = c; renderChips(); renderGrid(); });
      bar.appendChild(b);
    });
  }

  function renderGrid() {
    var grid = document.getElementById("newsGrid");
    grid.innerHTML = "";
    var list = items.filter(function (it) { return current === "全部" || it.cat === current; });
    if (!list.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">该分类暂无内容</div>';
      return;
    }
    list.forEach(function (it, idx) {
      var color = CAT_COLOR[it.cat] || "#64748b";
      var art = document.createElement("article");
      art.className = "card" + (current === "全部" && it.cat === "头条" && idx < 2 ? " feature" : "");
      art.style.setProperty("--cat", color);
      art.innerHTML =
        '<div class="card-top"><span class="tag">' + esc(it.cat) + "</span>" +
        '<span class="card-date">' + esc(it.date || "") + "</span></div>" +
        "<h3><a href=\"" + esc(it.url || "#") + '" target="_blank" rel="noopener noreferrer">' + esc(it.title) + "</a></h3>" +
        "<p>" + esc(it.summary) + "</p>" +
        '<div class="src">来源：' + esc(it.source || "网络公开报道") + ' <span class="arrow">→</span></div>';
      grid.appendChild(art);
    });
  }

  renderChips();
  renderGrid();
})();
</script>
</body>
</html>
